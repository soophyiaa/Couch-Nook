<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">
</head>


<body>

    <div id="cabeçalho">
        <header>
            <span id="iconegame">🎮</span>
            <h1>COUCH&NOOK</h1>
        </header>
    </div>
    <br>

    <main>

        <div id="intro">
            <section>
                <h2 id="bemvindo">Bem vindo(a) ao Couch&Nook!</h2>
                <p id="p">fale a lingua do mundo, viva sem fronteiras!</p>
                <br>
                <br>
                <p id="p2">O Couch&Nook foi pensado minimamente em cada detalhe para os amantes e curiosos pelo
                    aprendizado e
                    cultura de idiomas com uma pitada de diversão.</p>
            </section>
        </div>
        <br>
        <div id="citacao">
            <figure>
                <blockquote>
                    <p><i>"Mude, mas comece devagar, porque a direção é mais importante que a velocidade."</i></p>
                </blockquote>

                <figcaption><cite>Clarice Lispector</cite></figcaption>
            </figure>
        </div>

        <br>

    
        <div id="formulario">

                <form action="" method="post">

                    <div id="email">
                        <label for="email">E-mail:</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <br>

                    <div id="senha">
                        <label for="senha">Senha:</label>
                        <input type="password" name="senha" id="senha" required>
                    </div>

                    <br>

                    <div id="nome">
                        <label for="nome">Nome de usuário:</label>
                        <input type="text" name="nome" id="nome" required>
                    </div>

                    <br>

                    <button type="submit" id="butaoentrar"> 🎮ENTRAR </button>

                </form>

            </section>

        </div>
        <div id="rodape">
            <footer>
                <p>&copy; 2026 Couch&Nook. Todos os direitos reservados.</p>
            </footer>

        </div>

    </main>

</body>

</html>
